<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="200" fill="url(#bg-grad)"/>

  <!-- Neck -->
  <path d="M170 310 L170 345 Q170 365 200 365 Q230 365 230 345 L230 310" fill="#E8B896"/>

  <!-- T-shirt / dark top -->
  <path d="M125 400 Q128 345 170 330 L170 345 Q170 365 200 365 Q230 365 230 345 L230 330 Q272 345 275 400 Z" fill="#1c1917"/>
  <!-- T-shirt collar -->
  <path d="M170 330 Q185 340 200 342 Q215 340 230 330" stroke="#2a2520" stroke-width="1" fill="none"/>

  <!-- Face shape - slightly more angular jaw -->
  <path d="M135 210 Q132 170 155 155 Q170 145 200 143 Q230 145 245 155 Q268 170 265 210 Q265 260 245 285 Q230 302 200 308 Q170 302 155 285 Q135 260 135 210Z" fill="#EDBE9E"/>

  <!-- Ears -->
  <ellipse cx="132" cy="220" rx="11" ry="17" fill="#DBA882"/>
  <ellipse cx="268" cy="220" rx="11" ry="17" fill="#DBA882"/>
  <ellipse cx="132" cy="220" rx="6" ry="10" fill="#D4A278" opacity="0.3"/>
  <ellipse cx="268" cy="220" rx="6" ry="10" fill="#D4A278" opacity="0.3"/>

  <!-- Jaw shadow / stubble area -->
  <path d="M160 270 Q180 300 200 305 Q220 300 240 270 Q248 258 248 248 L152 248 Q152 258 160 270Z" fill="#C9A07A" opacity="0.12"/>

  <!-- Eyes - wider, more expressive, friendly -->
  <!-- Left eye -->
  <ellipse cx="175" cy="215" rx="16" ry="11" fill="white"/>
  <circle cx="177" cy="216" r="8" fill="#5B9E5A"/>
  <circle cx="177" cy="216" r="4.5" fill="#2D5A2D"/>
  <circle cx="179" cy="213" r="2.2" fill="white" opacity="0.9"/>
  <circle cx="174" cy="219" r="1" fill="white" opacity="0.4"/>
  <!-- Left lower lid -->
  <path d="M162 221 Q175 226 188 221" stroke="#CFA07A" stroke-width="0.8" fill="none" opacity="0.5"/>

  <!-- Right eye -->
  <ellipse cx="225" cy="215" rx="16" ry="11" fill="white"/>
  <circle cx="223" cy="216" r="8" fill="#5B9E5A"/>
  <circle cx="223" cy="216" r="4.5" fill="#2D5A2D"/>
  <circle cx="225" cy="213" r="2.2" fill="white" opacity="0.9"/>
  <circle cx="220" cy="219" r="1" fill="white" opacity="0.4"/>
  <!-- Right lower lid -->
  <path d="M212 221 Q225 226 238 221" stroke="#CFA07A" stroke-width="0.8" fill="none" opacity="0.5"/>

  <!-- Eyebrows - natural, slightly thick -->
  <path d="M155 200 Q165 193 188 197" stroke="#3D2B1F" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <path d="M212 197 Q235 193 245 200" stroke="#3D2B1F" stroke-width="2.8" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
  <path d="M200 218 Q197 238 194 248" stroke="#CFA07A" stroke-width="1.5" fill="none"/>
  <path d="M189 252 Q194 257 200 256 Q206 257 211 252" stroke="#CFA07A" stroke-width="1.5" fill="none"/>

  <!-- Mouth - bigger friendly smile showing teeth slightly -->
  <path d="M178 275 Q188 288 200 289 Q212 288 222 275" stroke="#C47A5A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
