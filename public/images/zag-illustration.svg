  <path d="M182 275 Q191 270 200 272 Q209 270 218 275" stroke="#C47A5A" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- Smile fill -->
  <path d="M180 275 Q190 286 200 287 Q210 286 220 275 Z" fill="#C4564A" opacity="0.15"/>
  <!-- Teeth hint -->
  <path d="M186 277 L214 277" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

